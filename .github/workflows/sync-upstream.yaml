name: Sync Upstream & Rebase

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  issues: write

jobs:
  sync-and-rebase:
    if: github.repository == 'Infinitihub/DroppedNeedle'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/discovery-edition-picker
          fetch-depth: 0 # Full git history required for rebasing
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/DroppedNeedle/DroppedNeedle.git
          git fetch upstream main

      - name: Attempt Rebase on upstream/main
        id: rebase
        run: |
          if git rebase upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            git push --force-with-lease origin feature/discovery-edition-picker
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git rebase --abort
            exit 1
          fi

      - name: Notify on Merge Conflict
        if: failure() && steps.rebase.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Upstream Sync Conflict on feature/discovery-edition-picker',
              body: `Automated rebase on \`upstream/main\` failed due to merge conflicts.\n\nPlease resolve manually:\n\`\`\`powershell\ngit checkout feature/discovery-edition-picker\ngit fetch upstream\ngit rebase upstream/main\n# fix conflicts in files\ngit add .\ngit rebase --continue\ngit push --force-with-lease origin feature/discovery-edition-picker\n\`\`\``
            });